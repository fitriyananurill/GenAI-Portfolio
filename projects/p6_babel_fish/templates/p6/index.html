<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('p6.static', filename='style.css') }}" />
    <link rel="stylesheet" href="/chat.css" />

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="{{ url_for('p6.static', filename='script.js') }}"></script>
  </head>
  <body style="--c:var(--cyan);--b:var(--magenta)">
    <span class="deco float" style="top:14%;left:2%;font-size:3.4rem" aria-hidden="true">🐟</span>
    <span class="deco wiggle" style="top:58%;right:2%;font-size:3.2rem" aria-hidden="true">🌍</span>
    <span class="deco bounce" style="bottom:6%;left:3%;font-size:3rem" aria-hidden="true">💫</span>

    <div class="container h-700">
      <div class="row">
        <div class="col-12">
          <a class="back" href="/">← GenAI-Portfolio</a>
          <h1>Babel <span class="grad-text">Fish</span></h1>
          <p class="lead-text">Say it in English, hear it in another language. Pick a voice and the target language follows it.</p>
          <p class="hint-text">Type a sentence, or click the microphone and speak. Try: "Where is the nearest train station?"</p>
        </div>
        <div class="col-12 text-center d-flex justify-content-around">
          <div class="custom-control custom-switch mb-3 d-inline-block">
            <input
              type="checkbox"
              class="custom-control-input"
              id="light-dark-mode-switch"
            />
            <label class="custom-control-label" for="light-dark-mode-switch"
              >Toggle light/dark mode</label
            >
          </div>
          <div class="d-inline-block">
            <label class="voice-options-label" for="voice-options"
              >Choose a voice (sets the language)</label
            >
            <select id="voice-options">
              <option value="">default</option>
              <option value="en-US_MichaelV3Voice">Michael (English)</option>
              <option value="en-US_HenryV3Voice">Henry (English)</option>
              <option value="en-GB_KateV3Voice">Kate (English)</option>
              <option value="en-GB_JamesV3Voice">James (English)</option>
              <option value="en-GB_CharlotteV3Voice">
                Charlotte (English)
              </option>
              <option value="en-US_LisaV3Voice">Lisa (English)</option>
              <option value="en-US_KevinV3Voice">Kevin (English)</option>
              <option value="en-US_EmilyV3Voice">Emily (English)</option>
              <option value="en-US_AllisonV3Voice">Allison (English)</option>
              <option value="en-US_OliviaV3Voice">Olivia (English)</option>
              <option value="fr-CA_LouiseV3Voice">Louise (French)</option>
              <option value="fr-FR_ReneeV3Voice">Renee (French)</option>
              <option value="fr-FR_NicolasV3Voice">Nicolas (French)</option>
              <option value="it-IT_FrancescaV3Voice">
                Francesca (Italian)
              </option>
              <option value="pt-BR_IsabelaV3Voice">Isabela (Brazilian Portuguese)</option>
              <option value="es-ES_LauraV3Voice">Laura (Castilian Spanish)</option>
              <option value="es-LA_SofiaV3Voice">Sofia (Latin American Spanish)</option>
              <option value="es-ES_EnriqueV3Voice">Enrique (Castilian Spanish)</option>
            </select>
          </div>
        </div>
        <div class="col-12 col-md-8 mx-auto mb-4">
          <div id="chat-window" class="p-3 h-700">
            <div id="message-list"></div>
            <div class="loading-animation my-loading">
              <div class="loading-dots my-loading">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
              </div>
            </div>
            <div class="loading-animation">
              <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
              </div>
            </div>
          </div>
          <div class="input-group mt-1">
            <input
              type="text"
              id="message-input"
              aria-label="Your message"
              class="form-control"
              placeholder="Type your message here..."
            />
            <div class="input-group-append">
              <!-- <button id="send-button" class="btn btn-primary">Send</button> -->
              <button id="send-button" class="btn btn-primary microphone" aria-label="Record or send message">
                <i class="fa fa-microphone"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
