<!DOCTYPE html>
<html>
<head>
    <title>Chatbot BlenderBot</title>
</head>
<body>
    <h1>Chat dengan Bot</h1>
    <div id="chat-box" style="border:1px solid #ccc; height:300px; overflow-y:auto; padding:10px;"></div>
    <input type="text" id="user-input" placeholder="Ketik pesan..." style="width:80%;">
    <button onclick="sendMessage()">Kirim</button>

    <script>
        function sendMessage() {
            const inputBox = document.getElementById("user-input");
            const message = inputBox.value;
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += "<p><b>Kamu:</b> " + message + "</p>";
            inputBox.value = "";

            fetch("chatbot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                chatBox.innerHTML += "<p><b>Bot:</b> " + data.response + "</p>";
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
