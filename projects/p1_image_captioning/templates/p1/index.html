<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Captioning · GenAI-Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo.css">
</head>
<body style="--c:var(--magenta);--b:var(--yellow)">
  <main class="demo">
    <a class="back" href="/">← GenAI-Portfolio</a>
    <h1 class="ts">Image <span class="grad-text">Captioning</span></h1>
    <p class="lead">Drop in a photo. A vision model describes it in one sentence.</p>

    <section class="panel">
      <label class="drop" for="file">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
        <span id="hint">📷 Click to choose an image</span>
        <img id="preview" alt="Your uploaded image" hidden>
      </label>
      <button id="go" class="btn" disabled>Caption it ✨</button>
      <p id="out" class="result" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const file = document.getElementById("file"), go = document.getElementById("go");
    const preview = document.getElementById("preview"), out = document.getElementById("out");
    let blob = null;

    // Shrink to <=1024px JPEG in the browser: faster, and keeps uploads under the 4.5 MB host limit.
    async function shrink(f) {
      const img = await createImageBitmap(f);
      const s = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    }

    file.addEventListener("change", async () => {
      if (!file.files[0]) return;
      out.textContent = "";
      try {
        blob = await shrink(file.files[0]);
        preview.src = URL.createObjectURL(blob); preview.hidden = false;
        document.getElementById("hint").hidden = true;
        go.disabled = false;
      } catch { out.textContent = "Could not read that image."; }
    });

    go.addEventListener("click", async () => {
      go.disabled = true; out.textContent = "Looking…";
      const fd = new FormData(); fd.append("file", blob, "image.jpg");
      try {
        const r = await fetch("caption", { method: "POST", body: fd });
        const d = await r.json();
        out.textContent = d.caption || d.error || "Something went wrong.";
      } catch { out.textContent = "Network error, try again."; }
      go.disabled = false;
    });
  </script>
</body>
</html>
